{{- if and .Values.observability.enabled .Values.observability.otelCollector.enabled }}
{{- $otlp := .Values.observability.otelCollector.otlphttp -}}
{{- /* Only create a managed secret when an inline authHeader is provided and no existingSecret is set. */ -}}
{{- if and (ne (default "" $otlp.authHeader) "") (eq (default "" $otlp.existingSecret) "") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alquimia-slight.observability.otelCollector.secretName" . }}
  namespace: {{ include "alquimia-slight.observability.namespace" . }}
  labels:
    {{- include "alquimia-slight.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
type: Opaque
stringData:
  {{ include "alquimia-slight.observability.otelCollector.secretKey" . }}: {{ $otlp.authHeader | quote }}
{{- end }}
{{- end }}
