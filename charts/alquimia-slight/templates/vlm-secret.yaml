{{- if .Values.model.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alquimia-slight.vlm.fullname" . }}-secret
  labels:
    {{- include "alquimia-slight.labels" . | nindent 4 }}
    app.kubernetes.io/component: vlm
type: Opaque
stringData:
  VLLM_API_KEY: {{ .Values.model.apiKey | quote }}
  {{- if and .Values.model.downloader.enabled .Values.model.downloader.hfToken (not .Values.model.downloader.existingSecret) }}
  HF_TOKEN: {{ .Values.model.downloader.hfToken | quote }}
  {{- end }}
{{- end }}
