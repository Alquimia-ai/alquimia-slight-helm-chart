{{- if .Values.model.enabled }}
{{- $mountPath := include "alquimia-slight.vlm.modelMountPath" . -}}
{{- $modelPath := include "alquimia-slight.vlm.modelFullPath" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alquimia-slight.vlm.fullname" . }}
  labels:
    {{- include "alquimia-slight.labels" . | nindent 4 }}
    app.kubernetes.io/component: vlm
spec:
  replicas: {{ .Values.model.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "alquimia-slight.vlm.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "alquimia-slight.vlm.fullname" . }}
        app.kubernetes.io/component: vlm
    spec:
      runtimeClassName: {{ .Values.model.runtimeClassName }}
      imagePullSecrets:
{{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
{{- end }}
      initContainers:
        - name: wait-for-model
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              target="{{ $modelPath }}/config.json"
              echo "[wait-for-model] waiting for $target ..."
              i=0
              until [ -f "$target" ]; do
                i=$((i+1))
                if [ $((i % 12)) -eq 0 ]; then
                  echo "[wait-for-model] still waiting ($((i*5))s)..."
                fi
                sleep 5
              done
              echo "[wait-for-model] model ready."
          volumeMounts:
            - name: model-store
              mountPath: {{ $mountPath }}
      containers:
        - name: vllm
          image: "{{ .Values.model.image.repository }}@{{ .Values.model.image.digest }}"
          imagePullPolicy: {{ .Values.model.image.pullPolicy }}
          args:
            - "--model"
            - {{ $modelPath | quote }}
            - "--served-model-name"
            - {{ .Values.model.servedName | quote }}
            {{- range .Values.model.extraArgs }}
            - {{ . | quote }}
            {{- end }}
            - "--api-key"
            - "$(VLLM_API_KEY)"
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "alquimia-slight.vlm.fullname" . }}-secret
                  key: VLLM_API_KEY
            - name: HF_HOME
              value: {{ .Values.model.env.HF_HOME | quote }}
            - name: HF_HUB_OFFLINE
              value: {{ .Values.model.env.HF_HUB_OFFLINE | quote }}
            - name: TRANSFORMERS_OFFLINE
              value: {{ .Values.model.env.TRANSFORMERS_OFFLINE | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.model.service.port }}
          volumeMounts:
            - name: model-store
              mountPath: {{ $mountPath }}
          resources:
{{ toYaml .Values.model.resources | indent 12 }}
      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: {{ include "alquimia-slight.vlm.modelPvcName" . }}
{{- end }}
