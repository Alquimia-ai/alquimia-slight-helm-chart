global:
  # Public IP/hostname of the appliance used by clients to reach the UI and media streams.
  # Replace with the real node IP, VIP or DNS name (e.g. "10.0.0.10" or "slight.example.com").
  host: "192.168.1.100"

product:
  os: "RHEL 10 AI"
  targetPlatform: "appliance"

bff:
  secret:
    jwtSecret: "change-me"
    bootstrapAdminUsername: "adminBff"
    bootstrapAdminPassword: "change-me"

postgres:
  auth:
    username: bffUser
    password: change-me
  persistence:
    enabled: true
    size: 10Gi
    storageClass: longhorn

minio:
  persistence:
    enabled: true
    size: 20Gi
    storageClass: longhorn