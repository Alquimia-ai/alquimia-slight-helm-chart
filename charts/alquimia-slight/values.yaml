global:
  storageClass: longhorn
  host: ""
  imagePullSecrets:
    - regcred

product:
  name: "Alquimia Slight"
  suite: "Alquimia Vision"
  targetPlatform: "appliance"
  os: "RHEL 10 AI"

serviceAccount:
  create: true
  name: ""

engine:
  enabled: true
  replicaCount: 1
  image:
    repository: alquimiaai/argos-engine
    tag: v0.4.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  config:
    host: "0.0.0.0"
    port: "8000"
    logLevel: "debug"
    bffBaseUrl: ""
    natsUrl: ""
    frameBufferSize: "5"
    frameBatchSize: "1"
    storiesBufferSize: "5"
    storiesBatchSize: "2"
    media:
      # If empty and global.host is set, the chart builds rtsp://<host>:<mediamtx playback NodePort>.
      playbackBaseUrl: ""
      internalReaderToken: "change-me"
    evidence:
      preSeconds: "3"
      postSeconds: "3"
      retentionSeconds: "30"
      finalizeDelaySeconds: "3.25"
  resources:
    requests:
      cpu: 2
      memory: 2Gi
    limits:
      cpu: 3
      memory: 3Gi

bff:
  enabled: true
  replicaCount: 1
  image:
    repository: alquimiaai/argos-bff
    tag: bff-v0.16.0-beta.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8000
    nodePort: 32000
  config:
    host: "0.0.0.0"
    port: "8000"
    authDisabled: "true"
    storageBucket: "argos-evidence"
    natsUrl: ""
    engineBaseUrl: ""
    accessTokenTtlMinutes: ""
    refreshTokenTtlDays: ""
    mediaGateway:
      # If empty and global.host is set, the chart builds URLs using that host plus the mediamtx NodePorts (api/rtsp/webrtc).
      apiBaseUrl: ""
      engineRtspBaseUrl: ""
      publicWebrtcBaseUrl: ""
    virtualCameras:
      enabled: "true"
      storageBucket: "argos-virtual-cameras"
      storagePrefix: ""
      rtspBaseUrl: ""
      frameInterval: "1.0"
      profileName: "Oficina"
      cacheDir: "/tmp/argos-virtual-cameras"
  secret:
    # Set these in the environment values file (values-ubuntu.yaml, values-rhel10-ai.yaml, etc.).
    jwtSecret: ""
    bootstrapAdminUsername: ""
    bootstrapAdminPassword: ""
    mediamtxInternalReaderToken: "change-me"
    virtualCameraPublishToken: ""
  resources:
    requests:
      cpu: 2
      memory: 3Gi
    limits:
      cpu: 3
      memory: 4Gi

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    database: bffdb
    # Set username and password in the environment values file (e.g. values-ubuntu.yaml / values-rhel10-ai.yaml).
    username: ""
    password: ""
  persistence:
    enabled: true
    size: 100Gi
    storageClass: ""
  service:
    port: 5432
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

minio:
  enabled: true
  image:
    repository: quay.io/minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  rootUser: "change-me"
  rootPassword: "change-me"
  persistence:
    enabled: true
    size: 400Gi
    storageClass: ""
  service:
    type: NodePort
    apiPort: 9000
    consolePort: 9001
    nodePortApi: 30900
    nodePortConsole: 30901
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

model:
  enabled: true
  replicaCount: 1
  runtimeClassName: nvidia
  image:
    repository: vllm/vllm-openai
    digest: "sha256:2296a2a7e1ce1dc59c6577ba5900f4e9910b76c4a0cb134833a8137f92404dfa"
    pullPolicy: IfNotPresent
  # Canonical Hugging Face model identifier. Used for --served-model-name
  # and also as the default repoId for the downloader.
  servedName: "Qwen/Qwen3-VL-8B-Instruct"
  # Local subdirectory under mountPath where the model snapshot lives.
  # If left empty, it is derived from servedName (slashes -> "-", lowercased).
  localDir: ""
  # Mount path of the model volume inside the container.
  mountPath: /models
  apiKey: "change-me"
  # PVC that persists the downloaded model(s). It is kept across upgrades/uninstall
  # (resource-policy: keep) to avoid re-downloading.
  persistence:
    size: 50Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # If set, an existing PVC is used instead of creating a new one.
    existingClaim: ""
  # Pre-download Job that fetches the model from Hugging Face into the PVC.
  # Runs as a post-install/post-upgrade hook and is idempotent (skipped if the model already exists).
  downloader:
    enabled: true
    image:
      repository: python
      tag: "3.11-slim"
      pullPolicy: IfNotPresent
    # Hugging Face repo id to download. If empty, model.servedName is used.
    repoId: ""
    # Subdirectory inside the PVC where the snapshot is stored.
    # If empty, model.localDir is used (derived from servedName when that is also empty).
    targetSubdir: ""
    # Optional HF repo revision / branch / tag.
    revision: ""
    # HF token for gated/private models (optional). Can also be provided via existingSecret.
    hfToken: ""
    # If set, HF_TOKEN is read from this secret (key HF_TOKEN) instead of the inline hfToken.
    existingSecret: ""
    # Speed up downloads with hf_transfer.
    useHfTransfer: true
    # Optional glob-style filters (passed as-is to snapshot_download).
    allowPatterns: []
    ignorePatterns: []
    backoffLimit: 3
    activeDeadlineSeconds: 7200
    # Keep the Job around after completion so its logs can be inspected.
    ttlSecondsAfterFinished: 3600
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    nodeSelector: {}
    tolerations: []
    affinity: {}
  service:
    type: ClusterIP
    port: 8000
  # The --model and --served-model-name flags are injected automatically from model.servedName.
  # Only list additional vLLM arguments here.
  extraArgs:
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
    - "--max-model-len"
    - "3000"
    - "--gpu-memory-utilization"
    - "0.90"
    - "--trust-remote-code"
  env:
    HF_HOME: /models/hf-cache
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
  resources:
    requests:
      cpu: "8"
      memory: "24Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "12"
      memory: "32Gi"
      nvidia.com/gpu: "1"

nats:
  enabled: true
  config:
    cluster:
      enabled: false
    jetstream:
      enabled: false
  natsBox:
    enabled: false

web:
  enabled: true
  replicaCount: 1
  image:
    repository: alquimiaai/argos-web
    tag: web-v0.3.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    targetPort: 80
    nodePort: 31000
  config:
    viteAppTimeZone: "America/Argentina/Buenos_Aires"
    viteBffUrl: ""
    mediamtxPublicHost: ""
    mediamtxWebrtcAllowOrigins: ""
    mediamtxWebrtcAdditionalHosts: ""
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 20
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mediamtx:
  enabled: true
  createNamespace: true
  namespace: media
  replicaCount: 1
  image:
    repository: alquimiaai/mediamtx
    tag: v0.1.0
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    existingClaim: ""
  auth:
    httpAddress: ""
    bffNamespace: ""
    path: /internal/media/auth
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  webrtc:
    # "*" or empty: when global.host is set, the chart fills WebRTC origins/hosts automatically; any other value is used as-is.
    allowOrigins: "*"
    additionalHosts: "*"
  extraEnv: {}
  service:
    type: NodePort
    ports:
      - name: rtsp
        port: 8554
        targetPort: 8554
        nodePort: 31554
        protocol: TCP
      - name: hls
        port: 18888
        targetPort: 18888
        nodePort: 31888
        protocol: TCP
      - name: webrtc
        port: 8889
        targetPort: 8889
        nodePort: 31889
        protocol: TCP
      - name: webrtc-udp
        port: 8189
        targetPort: 8189
        nodePort: 31189
        protocol: UDP
      - name: playback
        port: 9996
        targetPort: 9996
        nodePort: 31996
        protocol: TCP
      - name: api
        port: 9997
        targetPort: 9997
        nodePort: 31997
        protocol: TCP
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Stand-alone observability stack, deployed into its own namespace.
# Provides:
#   - otelCollector: DaemonSet that collects host / kubelet / prometheus metrics
#     and (optionally) forwards them via OTLP/HTTP to a remote backend (e.g. Grafana Cloud).
#   - kubeStateMetrics: Deployment + Service exposing K8s resource state as Prometheus metrics.
#   - nodeProblemDetector: DaemonSet reporting node-level issues (kernel oops, OOM, read-only FS, etc.).
# Each sub-component can be toggled independently. Everything is disabled by default.
observability:
  enabled: false
  createNamespace: true
  namespace: observability
  # Value used for the "cluster" resource attribute in OTel metrics.
  cluster: "alquimia-slight"

  # OpenTelemetry configuration for the application pods (bff, engine, web).
  # When observability.enabled=true this is also active by default; set
  # apps.enabled=false to explicitly opt out without disabling the rest of the stack.
  #
  # Endpoint resolution (OTEL_EXPORTER_OTLP_ENDPOINT):
  #   1. If apps.exporterOtlpEndpoint is set, it is used as-is (e.g. point apps
  #      directly to Grafana Cloud or any external collector).
  #   2. Otherwise, if otelCollector.enabled is true, apps auto-target the
  #      bundled internal collector Service on port 4318 (OTLP/HTTP). The
  #      collector then forwards to the remote backend (see otelCollector.otlphttp).
  #   3. Otherwise the endpoint is empty and apps effectively run without OTel.
  apps:
    enabled: false
    logsEnabled: "true"
    exporterOtlpProtocol: "http/protobuf"
    exporterOtlpEndpoint: ""
    resourceAttributes: "deployment.environment=appliance,service.namespace=argos"
    exporterOtlpHeaders: ""
    serviceNames:
      bff: argos-bff
      engine: argos-engine
      web: argos-web

  otelCollector:
    enabled: true
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.123.0"
      pullPolicy: IfNotPresent
    collectionInterval: 30s
    serviceName: "otel-node-monitor"
    # Remote OTLP/HTTP backend. Leave endpoint empty to disable the remote exporter
    # (the collector will still expose its local Prometheus endpoint).
    #
    # Two scenarios:
    #   - On-premise: endpoint points to a backend on the same network, no auth
    #     required (typical when Grafana / Tempo / Prometheus run inside the cluster
    #     or in a trusted LAN). Leave authHeader and existingSecret empty.
    #   - Cloud (e.g. Grafana Cloud): endpoint is public and requires an Authorization
    #     header. Provide it via existingSecret (preferred) or inline authHeader.
    otlphttp:
      endpoint: ""
      # Full value of the HTTP Authorization header (e.g. "Basic <base64>").
      # Leave empty for on-premise setups that don't need auth.
      authHeader: ""
      # If set, the Authorization header is read from this pre-existing secret
      # (key = existingSecretKey). Takes precedence over inline authHeader.
      existingSecret: ""
      existingSecretKey: "Authorization"
    # Local Prometheus endpoint exposed by the collector (useful for in-cluster scraping).
    prometheusExporter:
      enabled: true
      port: 9464
    # Static Prometheus scrape targets wired into the collector pipeline.
    prometheusScrape:
      jobName: "k3s-supervisor"
      targets:
        - "127.0.0.1:6443"
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 512Mi

  kubeStateMetrics:
    enabled: true
    image:
      repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
      tag: "v2.17.0"
      pullPolicy: IfNotPresent
    service:
      port: 8080
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  nodeProblemDetector:
    enabled: true
    image:
      repository: registry.k8s.io/node-problem-detector/node-problem-detector
      tag: "v0.8.20"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi